# FundOS backend Nginx — gyain / befundos.gyain.com (10.130.0.34)
# TLS via the pre-issued wildcard *.gyain.com certificate.
# Upstream Gunicorn is bound to the private IP 10.130.0.34:8001.

server {
    listen 10.130.0.34:80;
    server_name befundos.gyain.com;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 10.130.0.34:443 ssl http2;
    server_name befundos.gyain.com;

    ssl_certificate     /etc/pki/gyain/fullchain.pem;
    ssl_certificate_key /etc/pki/gyain/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 60m;   # direct material uploads capped at 50 MB
    proxy_read_timeout   180s;  # export downloads / long polls

    location /static/ {
        alias /d01/fundos/app/current/staticfiles/;
        expires 30d;
    }

    location / {
        proxy_pass http://10.130.0.34:8001;
        proxy_set_header Host              $host;   # preserves tenant-bearing host
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme; # REQUIRED by prod settings
    }
}
